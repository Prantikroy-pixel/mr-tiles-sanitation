        .mobile-menu-toggle { display: flex; }
        .nav-links { position: fixed; top: 55px; left: 0; right: 0; background: #ffffff; padding: 0.85rem; flex-direction: column; border-bottom: 1px solid var(--border-color); box-shadow: 0 8px 16px rgba(0,0,0,0.08); transform: translateY(-150%); transition: transform 0.25s ease; }

        .catalog-section { padding: 0 1rem; }
        .product-grid { grid-template-columns: 1fr; }
        .admin-container { padding: 0 1rem; }
        .ai-window { width: calc(100vw - 1.7rem); right: -0.35rem; bottom: 3.4rem; height: 420px; }
      }
    </style>

      // Tile Calculator Modal
      function TileCalculatorModal({ product, onClose, onInquire }) {
        const [length, setLength] = useState(12);
        const [width, setWidth] = useState(10);
        const [wastagePercent, setWastagePercent] = useState(10);

        const pricePerSqFt = product && product.unit === 'sq.ft' ? product.price : 65;
        const netArea = Number(length || 0) * Number(width || 0);
        const totalArea = Math.ceil(netArea * (1 + Number(wastagePercent) / 100));
        const boxesNeeded = Math.ceil(totalArea / 16);
        const estimatedCost = totalArea * pricePerSqFt;

        return (
          <div className="modal-overlay" onClick={onClose}>
            <div className="modal-content" onClick={e => e.stopPropagation()}>

                <div>
                  <label style={{ display: 'block', fontSize: '0.78rem', color: '#64748b', marginBottom: '0.25rem' }}>Width (Feet)</label>
                  <input type="number" min="1" value={width} onChange={e => setWidth(e.target.value)} style={{ width: '100%', padding: '0.5rem', border: '1px solid #cbd5e1', borderRadius: '6px' }} />
                </div>
              </div>

              <div style={{ background: '#f8fafc', padding: '1rem', borderRadius: '6px', border: '1px solid #e2e8f0', marginBottom: '1rem' }}>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.5rem', fontSize: '0.85rem' }}>
                  <div>Net Area: <strong>{netArea} sq.ft</strong></div>
                  <div>Required: <strong>{totalArea} sq.ft</strong></div>
                  <div>Boxes: <strong>{boxesNeeded} boxes</strong></div>
                  <div>Cost: <strong style={{ color: '#16a34a' }}>₹{estimatedCost.toLocaleString('en-IN')}</strong></div>
                </div>
              </div>

              <button className="btn-primary" style={{ width: '100%', justifyContent: 'center' }} onClick={() => { onClose(); if (onInquire) onInquire(product, `Calculated ${totalArea} sq.ft (${boxesNeeded} boxes) for ${length}x${width} ft room. Est. Cost: ₹${estimatedCost}`); }}>
                Book Order Inquiry with Calculation →
              </button>
            </div>
          </div>
        );
      }

      // Inquiry Modal
      function InquiryModal({ product, initialNote, onClose }) {
        const [name, setName] = useState('');
        const [phone, setPhone] = useState('');
        const [message, setMessage] = useState(initialNote || '');

        const getWhatsAppLink = () => {
          const text = `Hello M R Tiles & Sanitation! 👋\n*Name*: ${name || 'Customer'}\n*Phone*: ${phone || 'N/A'}\n*Product Interest*: ${product ? product.name : 'General Inquiry'}\n*Details*: ${message}\nPlease provide best trade quote!`;
          return `https://wa.me/916001399842?text=${encodeURIComponent(text)}`;
        };

        return (
          <div className="modal-overlay" onClick={onClose}>
            <div className="modal-content" onClick={e => e.stopPropagation()}>
              <button className="modal-close" onClick={onClose}>✕</button>
              <h3 style={{ fontSize: '1.25rem', color: '#0f172a', marginBottom: '0.25rem' }}>💬 Request Quote & Best Price</h3>
              <p style={{ fontSize: '0.82rem', color: '#64748b', marginBottom: '1rem' }}>
                {product ? `Inquiring about: ${product.name} (₹${product.price}/${product.unit})` : 'Get trade price quote from Silchar showroom team'}
              </p>

              <div style={{ marginBottom: '0.75rem' }}>
                <label style={{ display: 'block', fontSize: '0.78rem', color: '#64748b', marginBottom: '0.2rem' }}>Full Name *</label>
                <input type="text" required placeholder="e.g. Rahul Roy" value={name} onChange={e => setName(e.target.value)} style={{ width: '100%', padding: '0.5rem', border: '1px solid #cbd5e1', borderRadius: '6px' }} />
              </div>

              <div style={{ marginBottom: '0.75rem' }}>
                <label style={{ display: 'block', fontSize: '0.78rem', color: '#64748b', marginBottom: '0.2rem' }}>Phone / WhatsApp Number *</label>
                <input type="tel" required placeholder="+91 98765 43210" value={phone} onChange={e => setPhone(e.target.value)} style={{ width: '100%', padding: '0.5rem', border: '1px solid #cbd5e1', borderRadius: '6px' }} />
              </div>

              <div style={{ marginBottom: '1rem' }}>
                <label style={{ display: 'block', fontSize: '0.78rem', color: '#64748b', marginBottom: '0.2rem' }}>Details / Room Size</label>
                <textarea rows="3" placeholder="Room size, delivery date..." value={message} onChange={e => setMessage(e.target.value)} style={{ width: '100%', padding: '0.5rem', border: '1px solid #cbd5e1', borderRadius: '6px', fontFamily: 'inherit' }} />
              </div>

              <a href={getWhatsAppLink()} target="_blank" rel="noopener noreferrer" className="btn-whatsapp" style={{ width: '100%', justifyContent: 'center' }}>
                💬 Send Quote via WhatsApp Direct
              </a>
            </div>
          </div>
        );
      }

      // AI Assistant Component
      function AiAssistant({ isOpen, setIsOpen, onInquire, allProducts = [] }) {
        const [messages, setMessages] = useState([
          { sender: 'ai', text: 'Hello! I am your AI Design & Tile Advisor for M R Tiles & Sanitation. How can I help you calculate coverage or estimate budget today?' }
        ]);
        const [input, setInput] = useState('');

        const handleSend = (e) => {
          e.preventDefault();
          if (!input.trim()) return;
          const userText = input.trim();
          setInput('');

          let reply = `Thank you for asking! For room tile coverage & best finish recommendations at M R Tiles & Sanitation, we recommend high-gloss vitrified floor tiles and rimless ceramic sanitaryware.`;
          const query = userText.toLowerCase();
          const dimMatch = query.match(/(\d+)\s*(?:x|by|\*)\s*(\d+)/i);
          
          if (dimMatch) {
            const l = parseFloat(dimMatch[1]);
            const w = parseFloat(dimMatch[2]);
            const area = l * w;
            const totalArea = Math.ceil(area * 1.1);
            const boxes = Math.ceil(totalArea / 16);
            const cost = totalArea * 65;
            reply = `For a room of **${l} × ${w} ft** (${area} sq.ft):\n• Required (w/ 10% wastage): ~${totalArea} sq.ft\n• Boxes Needed: ~${boxes} boxes\n• Estimated Cost: ₹${cost.toLocaleString('en-IN')}`;
          }

          setMessages(prev => [
            ...prev,
            { sender: 'user', text: userText },
            { sender: 'ai', text: reply, suggestedProducts: allProducts.slice(0, 2) }
          ]);
        };

        return (
          <div className="ai-widget">
            {!isOpen && (
              <button className="ai-trigger" onClick={() => setIsOpen(true)}>
                ✨<span className="ai-badge-dot"></span>
              </button>
            )}

            {isOpen && (
              <div className="ai-window">
                <div className="ai-header">
                  <div style={{ fontWeight: '700', fontSize: '0.9rem' }}>✨ AI Tile & Room Advisor</div>
                  <button style={{ background: 'transparent', color: '#64748b' }} onClick={() => setIsOpen(false)}>✕</button>
                </div>

                <div className="ai-messages">
                  {messages.map((m, i) => (
                    <div key={i} className={`chat-bubble ${m.sender}`}>
                      {m.text}
                      {m.suggestedProducts && (
                        <div style={{ marginTop: '0.4rem', borderTop: '1px solid #e2e8f0', paddingTop: '0.4rem' }}>
                          {m.suggestedProducts.map(p => (
                            <div key={p.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '0.2rem' }}>
                              <span style={{ fontSize: '0.78rem', fontWeight: '600' }}>{p.name} (₹{p.price}/{p.unit})</span>
                              <button className="btn-sm-inquire" style={{ padding: '0.2rem 0.4rem', fontSize: '0.7rem' }} onClick={() => onInquire(p)}>Inquire</button>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  ))}
                </div>

                <form className="ai-input-wrap" onSubmit={handleSend}>
                  <input type="text" className="ai-input" placeholder="Ask about room coverage..." value={input} onChange={e => setInput(e.target.value)} />
                  <button type="submit" className="ai-send-btn">➔</button>
                </form>
              </div>
            )}
          </div>
        );
      }

      // Customer Store View
      function CustomerStore({ products, activeCategory, setActiveCategory, search, setSearch, onOpenCalc, onInquire }) {
        const categories = [
          { id: 'all', label: 'All Products' },
          { id: 'floor-tiles', label: 'Floor Tiles' },
          { id: 'wall-tiles', label: 'Wall Tiles' },
          { id: 'bathroom-fittings', label: 'Bathroom Fittings' },
          { id: 'kitchen-solutions', label: 'Kitchen Solutions' }
        ];

        return (
          <main>
            <section className="hero-section">
              <div className="hero-badge">M R TILES AND SANITATION • SILCHAR</div>
              <h1 className="hero-heading">Premium Tiles & <span>Sanitary Solutions</span></h1>
              <p className="hero-desc">Quality • Design • Durability. Discover high-gloss marble vitrified floor tiles, ceramic wall designs, and smart rimless sanitaryware.</p>
              <div className="hero-actions">
                <button className="btn-primary" onClick={() => onOpenCalc(null)}>📐 Tile & Budget Calculator</button>
                <a href="#catalog" className="btn-secondary">Browse Store Catalog →</a>
              </div>
            </section>

            <div id="catalog" className="filter-container">
              <div className="category-tabs">
                {categories.map(cat => (
                  <button key={cat.id} className={`tab-btn ${activeCategory === cat.id ? 'active' : ''}`} onClick={() => setActiveCategory(cat.id)}>
                    {cat.label}
                  </button>
                ))}
              </div>

              <div className="search-box">
                <input type="text" className="search-input" placeholder="Search marble, basin..." value={search} onChange={e => setSearch(e.target.value)} />
              </div>
            </div>

            <section className="catalog-section">
              <div className="product-grid">
                {products.map(prod => (
                  <div key={prod.id} className="product-card">
                    <div className="card-image-wrap">
                      <img src={prod.image} alt={prod.name} className="card-img" onError={e => e.target.src = 'public/images/regal-white-marble.png'} />
                      <div className={`stock-badge ${prod.stock <= 0 ? 'out-of-stock' : (prod.stock <= 20 ? 'low-stock' : 'in-stock')}`}>
                        {prod.stock <= 0 ? 'Out of Stock' : (prod.stock <= 20 ? `Low Stock (${prod.stock})` : `In Stock (${prod.stock})`)}
                      </div>
                      <div className="category-tag">{prod.categoryLabel || prod.category}</div>
                    </div>

                    <div className="card-body">
                      <h3 className="card-title">{prod.name}</h3>
                      <p className="card-specs">{prod.dimensions} • {prod.finish}</p>
                      <p style={{ fontSize: '0.8rem', color: '#64748b', marginBottom: '0.75rem', flex: 1 }}>{prod.description}</p>

                      <div className="card-price-row">
                        <div><span className="price-main">₹{prod.price.toLocaleString('en-IN')}</span> <span className="price-unit">/ {prod.unit}</span></div>
                      </div>

                      <div className="card-actions">
                        <button className="btn-sm-calc" onClick={() => onOpenCalc(prod)}>📐 Calculate</button>
                        <button className="btn-sm-inquire" onClick={() => onInquire(prod)}>Request Quote</button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </section>
          </main>
        );
      }

      // Admin Portal View
      function AdminPortal({ products, adminToken, onLogin, onUpdateProduct, onAddProduct, onDeleteProduct }) {
        const [username, setUsername] = useState('');
        const [password, setPassword] = useState('');
        const [editingId, setEditingId] = useState(null);
        const [editPrice, setEditPrice] = useState('');
        const [editStock, setEditStock] = useState('');

        const handleLoginSubmit = (e) => {
          e.preventDefault();
          if (username.trim() === 'admin' && password.trim() === 'admin123') {
            onLogin('mr_admin_token_' + Date.now());
          } else {
            alert('Invalid credentials! Default: admin / admin123');
          }
        };

        if (!adminToken) {
          return (
            <div style={{ maxWidth: '400px', margin: '3rem auto', padding: '1.5rem', background: '#ffffff', borderRadius: '8px', border: '1px solid #e2e8f0' }}>
              <h2 style={{ fontSize: '1.4rem', color: '#0f172a', marginBottom: '0.5rem', textAlign: 'center' }}>🛡️ Admin Portal Login</h2>
              <form onSubmit={handleLoginSubmit}>
                <div style={{ marginBottom: '0.85rem' }}>
                  <label style={{ display: 'block', fontSize: '0.8rem', color: '#64748b', marginBottom: '0.2rem' }}>Username</label>
                  <input type="text" required placeholder="admin" value={username} onChange={e => setUsername(e.target.value)} style={{ width: '100%', padding: '0.55rem', border: '1px solid #cbd5e1', borderRadius: '6px' }} />
                </div>
                <div style={{ marginBottom: '1.25rem' }}>
                  <label style={{ display: 'block', fontSize: '0.8rem', color: '#64748b', marginBottom: '0.2rem' }}>Password</label>
                  <input type="password" required placeholder="admin123" value={password} onChange={e => setPassword(e.target.value)} style={{ width: '100%', padding: '0.55rem', border: '1px solid #cbd5e1', borderRadius: '6px' }} />
                </div>
                <button type="submit" className="btn-primary" style={{ width: '100%', justifyContent: 'center' }}>Sign In to Dashboard</button>
              </form>
            </div>
          );
        }

        return (
          <div className="admin-container">
            <h1 style={{ fontSize: '1.6rem', marginBottom: '1rem' }}>Stock & Price Control Center</h1>
            <div className="admin-table-wrap">
              <table className="admin-table">
                <thead>
                  <tr>
                    <th>Item</th>
                    <th>Category</th>
                    <th>Price (₹)</th>
                    <th>Stock</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {products.map(p => (
                    <tr key={p.id}>
                      <td><strong>{p.name}</strong></td>
                      <td>{p.categoryLabel || p.category}</td>
                      <td>
                        {editingId === p.id ? (
                          <input type="number" value={editPrice} onChange={e => setEditPrice(e.target.value)} style={{ width: '70px', padding: '0.2rem' }} />
                        ) : (
                          `₹${p.price}/${p.unit}`
                        )}
                      </td>
                      <td>
                        {editingId === p.id ? (
                          <input type="number" value={editStock} onChange={e => setEditStock(e.target.value)} style={{ width: '70px', padding: '0.2rem' }} />
                        ) : (
                          `${p.stock} ${p.unit}`
                        )}
                      </td>
                      <td>
                        {editingId === p.id ? (
                          <button onClick={() => { onUpdateProduct(p.id, { price: Number(editPrice), stock: Number(editStock) }); setEditingId(null); }}>Save</button>
                        ) : (
                          <button onClick={() => { setEditingId(p.id); setEditPrice(p.price); setEditStock(p.stock); }}>Edit</button>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        );
      }

      // Root App Component
      function App() {
        const [currentView, setCurrentView] = useState('store');
        const [products, setProducts] = useState(INITIAL_PRODUCTS);
        const [activeCategory, setActiveCategory] = useState('all');
        const [search, setSearch] = useState('');
        const [adminToken, setAdminToken] = useState('');

        const [calcProduct, setCalcProduct] = useState(null);
        const [showCalcModal, setShowCalcModal] = useState(false);
        const [inquireProduct, setInquireProduct] = useState(null);
        const [inquireNote, setInquireNote] = useState('');
        const [showInquireModal, setShowInquireModal] = useState(false);
        const [isAiOpen, setIsAiOpen] = useState(false);

        const filtered = products.filter(p => {
          if (activeCategory !== 'all' && p.category !== activeCategory) return false;
          if (search && !p.name.toLowerCase().includes(search.toLowerCase())) return false;
          return true;
        });

        return (
          <div className="app-container">
            <Header currentView={currentView} setCurrentView={setCurrentView} adminToken={adminToken} onLogout={() => setAdminToken('')} onOpenAi={() => setIsAiOpen(true)} />

            {currentView === 'store' ? (
              <CustomerStore products={filtered} activeCategory={activeCategory} setActiveCategory={setActiveCategory} search={search} setSearch={setSearch} onOpenCalc={p => { setCalcProduct(p); setShowCalcModal(true); }} onInquire={(p, note) => { setInquireProduct(p); setInquireNote(note || ''); setShowInquireModal(true); }} />
            ) : (
              <AdminPortal products={products} adminToken={adminToken} onLogin={token => setAdminToken(token)} onUpdateProduct={(id, payload) => setProducts(prev => prev.map(p => p.id === id ? { ...p, ...payload } : p))} />
            )}

            {showCalcModal && <TileCalculatorModal product={calcProduct} onClose={() => setShowCalcModal(false)} onInquire={(p, note) => { setInquireProduct(p); setInquireNote(note); setShowInquireModal(true); }} />}
            {showInquireModal && <InquiryModal product={inquireProduct} initialNote={inquireNote} onClose={() => setShowInquireModal(false)} />}
            <AiAssistant isOpen={isAiOpen} setIsOpen={setIsAiOpen} onInquire={(p, note) => { setInquireProduct(p); setInquireNote(note); setShowInquireModal(true); }} allProducts={products} />

            <footer className="footer">
              <div className="footer-bottom">© {new Date().getFullYear()} M R TILES AND SANITATION. All rights reserved.</div>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
