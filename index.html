      // Smart Image Loader Helper with Safe Fallback
      function ProductImage({ src, alt, className }) {
        const defaultFallback = 'images/regal-white-marble.png';
        const initialSrc = src || defaultFallback;
        const [imgSrc, setImgSrc] = useState(initialSrc);
        const [fallbackIndex, setFallbackIndex] = useState(0);

        const fallbacks = [
          initialSrc,
          `./${initialSrc}`,
          `images/${(initialSrc || '').replace(/^images\//, '')}`,
          defaultFallback
        ];

        const handleError = () => {
          if (fallbackIndex < fallbacks.length - 1) {
            const nextIdx = fallbackIndex + 1;
            setFallbackIndex(nextIdx);
            setImgSrc(fallbacks[nextIdx]);
          } else {
            setImgSrc(defaultFallback);
          }
        };

        return <img src={imgSrc || defaultFallback} alt={alt} className={className} loading="lazy" onError={handleError} />;
      }

      // Tile Calculator Modal Component
      function TileCalculatorModal({ product, onClose, onInquire }) {
        const [length, setLength] = useState(12);
        const [width, setWidth] = useState(10);
        const [wastagePercent, setWastagePercent] = useState(10);

        const pricePerSqFt = product && product.unit === 'sq.ft' ? product.price : 70;
        const netArea = Number(length || 0) * Number(width || 0);
        const wastageArea = (netArea * Number(wastagePercent)) / 100;
        const totalArea = Math.ceil(netArea + wastageArea);
        
        const sqFtPerBox = 16;
        const boxesNeeded = Math.ceil(totalArea / sqFtPerBox);
        const estimatedCost = totalArea * pricePerSqFt;

        return (
          <div className="modal-overlay" onClick={onClose}>
            <div className="modal-content" onClick={e => e.stopPropagation()} style={{ maxWidth: '440px' }}>

                  <label style={{ display: 'block', fontSize: '0.78rem', color: '#64748b', marginBottom: '0.2rem' }}>Length (Feet)</label>

                </div>
                <div>
                  <label style={{ display: 'block', fontSize: '0.78rem', color: '#64748b', marginBottom: '0.2rem' }}>Width (Feet)</label>
                  <input type="number" min="1" value={width} onChange={e => setWidth(e.target.value)} style={{ width: '100%', padding: '0.5rem', border: '1px solid #cbd5e1', borderRadius: '6px' }} />
                </div>
              </div>

              <div style={{ marginBottom: '1rem' }}>
                <label style={{ display: 'block', fontSize: '0.78rem', color: '#64748b', marginBottom: '0.2rem' }}>Cutting & Wastage Margin</label>
                <div style={{ display: 'flex', gap: '0.4rem' }}>
                  {[5, 10, 15].map(pct => (
                    <button key={pct} type="button" onClick={() => setWastagePercent(pct)} style={{ flex: 1, padding: '0.4rem', borderRadius: '6px', fontSize: '0.78rem', fontWeight: 'bold', background: wastagePercent === pct ? '#0f172a' : '#ffffff', color: wastagePercent === pct ? '#ffffff' : '#64748b', border: '1px solid #cbd5e1' }}>

      // WhatsApp Inquiry Modal Component

      function App() {
        const [currentView, setCurrentView] = useState('store');
        
        const [products, setProducts] = useState(() => {
          try {
            const local = localStorage.getItem('mr_tiles_permanent_catalog_v12');
            if (local) {
              const parsed = JSON.parse(local);
              if (Array.isArray(parsed) && parsed.length > 0) return parsed;
            }
          } catch(e) {}
          return INITIAL_PRODUCTS;
        });

        const [categories, setCategories] = useState([
          { id: 'all', label: 'All Products' },
          { id: 'floor-tiles', label: 'Floor Tiles' },
          { id: 'wall-tiles', label: 'Wall Tiles' },
          { id: 'sanitary', label: 'Sanitary' },
          { id: 'doors', label: 'Doors' }
        ]);
        const [activeCategory, setActiveCategory] = useState('all');
        const [adminToken, setAdminToken] = useState('');

        const [calcProduct, setCalcProduct] = useState(null);
        const [showCalcModal, setShowCalcModal] = useState(false);
        const [inquireProduct, setInquireProduct] = useState(null);
        const [inquireNote, setInquireNote] = useState('');
        const [showInquireModal, setShowInquireModal] = useState(false);

        // Self-Healing Smart Merge Fetch Logic
        const fetchCloudProducts = async () => {
          try {
            const res = await fetch(LIVE_CLOUD_API_URL);
            if (res.ok) {
              const result = await res.json();
              const cloudProdList = result.products || (Array.isArray(result) ? result : null);
              if (cloudProdList && Array.isArray(cloudProdList)) {
                let localProdList = [];
                try {
                  const cached = localStorage.getItem('mr_tiles_permanent_catalog_v12');
                  if (cached) localProdList = JSON.parse(cached);
                } catch (e) {}

                const mergedMap = new Map();
                cloudProdList.forEach(p => {
                  if (p && p.id) {
                    mergedMap.set(p.id, {
                      ...p,
                      unit: p.unit || 'sq.ft',
                      image: p.image || 'images/regal-white-marble.png'
                    });
                  }
                });

                let missingInCloud = false;
                localProdList.forEach(p => {
                  if (p && p.id && !mergedMap.has(p.id)) {
                    mergedMap.set(p.id, p);
                    missingInCloud = true;
                  }
                });

                const finalMergedList = Array.from(mergedMap.values());

                if (finalMergedList.length > 0) {
                  setProducts(finalMergedList);
                  try {
                    localStorage.setItem('mr_tiles_permanent_catalog_v12', JSON.stringify(finalMergedList));
                  } catch (e) {}

                  if (missingInCloud || finalMergedList.length > cloudProdList.length) {
                    fetch(LIVE_CLOUD_API_URL, {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify(finalMergedList)
                    }).catch(() => {});
                  }
                }
              }
            }
          } catch (err) {}
        };

        useEffect(() => {
          fetchCloudProducts();
          const timer = setInterval(fetchCloudProducts, 4000);
          return () => clearInterval(timer);
        }, []);

        // Dynamically sync custom categories across devices based on product catalog
        useEffect(() => {
          if (products && products.length > 0) {
            const knownIds = new Set(categories.map(c => c.id));
            const newFoundCats = [];

            products.forEach(p => {
              if (p.category && !knownIds.has(p.category)) {
                knownIds.add(p.category);
                newFoundCats.push({
                  id: p.category,
                  label: p.categoryLabel || p.category.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ')
                });
              }
            });

            if (newFoundCats.length > 0) {
              setCategories(prev => [...prev, ...newFoundCats]);
            }
          }
        }, [products]);

        // Push Updates to State, Local & Cloud DB
        const pushToCloud = async (updatedList) => {
          const sanitized = updatedList.map(p => ({
            ...p,
            unit: p.unit || 'sq.ft',
            image: p.image || 'images/regal-white-marble.png'
          }));

          setProducts(sanitized);

          try {
            localStorage.setItem('mr_tiles_permanent_catalog_v12', JSON.stringify(sanitized));
          } catch(e) {}

          try {
            await fetch(LIVE_CLOUD_API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(sanitized)
            });
          } catch (err) {}
        };

        const filtered = products.filter(p => activeCategory === 'all' || p.category === activeCategory);

        return (
          <div className="app-container">
            <Header currentView={currentView} setCurrentView={setCurrentView} adminToken={adminToken} onLogout={() => setAdminToken('')} />

            {currentView === 'store' ? (
              <CustomerStore products={filtered} categories={categories} activeCategory={activeCategory} setActiveCategory={setActiveCategory} onOpenCalc={p => { setCalcProduct(p); setShowCalcModal(true); }} onInquire={(p, note) => { setInquireProduct(p); setInquireNote(note || ''); setShowInquireModal(true); }} onDownloadPdf={() => window.print()} />
            ) : (
              <AdminPortal products={products} categories={categories} adminToken={adminToken} onLogin={token => setAdminToken(token)} onUpdateProduct={(id, payload) => pushToCloud(products.map(p => p.id === id ? { ...p, ...payload, unit: payload.unit || p.unit || 'sq.ft' } : p))} onAddProduct={p => pushToCloud([{ id: 'prod_' + Date.now(), unit: p.unit || 'sq.ft', image: p.image || 'images/regal-white-marble.png', ...p }, ...products])} onDeleteProduct={id => window.confirm('Delete stock item?') && pushToCloud(products.filter(p => p.id !== id))} onAddCategory={c => setCategories(prev => [...prev, c])} />
            )}

            {/* Modals rendered cleanly */}
            {showCalcModal && (
              <TileCalculatorModal 
                product={calcProduct} 
                onClose={() => setShowCalcModal(false)} 
                onInquire={(p, note) => { setInquireProduct(p); setInquireNote(note || ''); setShowInquireModal(true); }} 
              />
            )}

            {showInquireModal && (
              <InquiryModal 
                product={inquireProduct} 
                initialNote={inquireNote} 
                onClose={() => setShowInquireModal(false)} 
              />
            )}

            <footer className="footer">
              <div className="footer-bottom">© {new Date().getFullYear()} BLUE LEAF TECH. All rights reserved.</div>
            </footer>
          </div>
        );
      }

      // Customer Store Component
      function CustomerStore({ products, categories, activeCategory, setActiveCategory, onOpenCalc, onInquire, onDownloadPdf }) {
        return (
          <main style={{ background: '#ffffff' }}>
            <section className="hero-section">
              <div className="hero-badge">M R TILES AND SANITATION • SILCHAR</div>
              <h1 className="hero-heading">Premium Tiles & <span>Sanitary Solutions</span></h1>
              <p className="hero-desc" style={{ fontWeight: '600', letterSpacing: '0.04em', color: '#475569', fontSize: '1.05rem', margin: '0 auto 1.5rem' }}>Quality • Design • Durability</p>
              
              <div className="hero-actions">
                <button className="btn-primary" onClick={() => onOpenCalc(null)}>Tile & Budget Calculator</button>
                <button className="btn-secondary" onClick={onDownloadPdf}>📄 Download Catalog (PDF)</button>
              </div>
            </section>

            <div className="filter-container">
              <div className="category-tabs">
                {categories.map(cat => (
                  <button key={cat.id} className={`tab-btn ${activeCategory === cat.id ? 'active' : ''}`} onClick={() => setActiveCategory(cat.id)}>
                    {cat.label}
                  </button>
                ))}
              </div>
            </div>

            <section className="catalog-section">
              <div className="product-grid">
                {products.map(prod => {
                  const displayUnit = prod.unit || 'sq.ft';

                  return (
                    <div key={prod.id} className="product-card">
                      <div className="card-image-wrap">
                        <ProductImage src={prod.image} alt={prod.name} className="card-img" />
                        <div className={`stock-badge ${prod.stock <= 0 ? 'out-of-stock' : (prod.stock <= 20 ? 'low-stock' : 'in-stock')}`}>
                          {prod.stock <= 0 ? 'Out of Stock' : (prod.stock <= 20 ? `Low Stock (${prod.stock})` : `In Stock (${prod.stock})`)}
                        </div>
                        <div className="category-tag">{prod.categoryLabel || prod.category}</div>
                      </div>

                      <div className="card-body">
                        <h3 className="card-title">{prod.name}</h3>
                        <p className="card-specs">{prod.dimensions} • {prod.finish}</p>
                        
                        <p style={{ fontSize: '0.8rem', color: '#64748b', marginBottom: '0.75rem', flex: 1 }}>{prod.description}</p>

                        <div className="card-price-row">
                          <div><span className="price-main">₹{prod.price.toLocaleString('en-IN')}</span> <span className="price-unit">/ {displayUnit}</span></div>
                        </div>

                        <div className="card-actions">
                          <button className="btn-sm-calc" onClick={() => onOpenCalc(prod)}>Calculate</button>
                          <button className="btn-sm-inquire" onClick={() => onInquire(prod, `Inquiry for ${prod.name}`)}>Request Quote</button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </section>

            {/* Showroom Google Map Location Section */}
            <section style={{ maxWidth: '1200px', margin: '3rem auto', padding: '0 1.5rem' }}>
              <div style={{ background: '#ffffff', borderRadius: '8px', padding: '2rem', border: '1px solid #e2e8f0', display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '2rem' }}>
                <div>
                  <h2 style={{ fontSize: '1.5rem', color: '#0f172a', marginBottom: '0.5rem' }}>M R Tiles & Sanitation</h2>
                  <p style={{ color: '#64748b', fontSize: '0.9rem', marginBottom: '1rem' }}>Trinayani Ln, near Karan TVS Showroom, Kanakpur, Silchar, Assam - 788006</p>
                  <p style={{ fontSize: '0.88rem', color: '#0f172a', fontWeight: 'bold' }}>Call / WhatsApp: +91 60013 99842</p>
                </div>
                <div style={{ borderRadius: '8px', overflow: 'hidden', minHeight: '300px' }}>
                  <iframe title="Showroom Location Map" src="https://maps.google.com/maps?q=M+R+TILES+AND+SANITATION,+Trinayani+Ln,+near+Karan+TVS+Showroom,+Kanakpur,+Silchar,+Assam+788006&t=&z=16&ie=UTF8&iwloc=&output=embed" width="100%" height="100%" style={{ border: 0, minHeight: '300px' }} loading="lazy" />
                </div>
              </div>
            </section>
          </main>
        );
      }

      // Mobile Responsive Admin Portal with Add Tile, Add Category, & Device Photo Uploader
      function AdminPortal({ products, categories, adminToken, onLogin, onUpdateProduct, onAddProduct, onDeleteProduct, onAddCategory }) {
        const [username, setUsername] = useState('');
        const [password, setPassword] = useState('');
        const [loginError, setLoginError] = useState('');

        const [editingId, setEditingId] = useState(null);
        const [editName, setEditName] = useState('');
        const [editPrice, setEditPrice] = useState('');
        const [editStock, setEditStock] = useState('');

        // Add Product Modal State
        const [showAddModal, setShowAddModal] = useState(false);
        const [newName, setNewName] = useState('');
        const [newCategory, setNewCategory] = useState('floor-tiles');
        const [newPrice, setNewPrice] = useState('');
        const [newUnit, setNewUnit] = useState('sq.ft');
        const [newStock, setNewStock] = useState('');
        const [newDimensions, setNewDimensions] = useState('2x4 ft (600x1200 mm)');
        const [newFinish, setNewFinish] = useState('High Gloss Polished');
        const [newImage, setNewImage] = useState('images/regal-white-marble.png');
        const [newDescription, setNewDescription] = useState('');

        // Add Category Modal State
        const [showAddCatModal, setShowAddCatModal] = useState(false);
        const [newCatLabel, setNewCatLabel] = useState('');

        // Handle Direct Device Image Upload with Canvas Compression
        const handleImageFileUpload = (e) => {
          const file = e.target.files[0];
          if (file && file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = (uploadEvent) => {
              const img = new Image();
              img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                const maxWidth = 800;
                if (width > maxWidth) {
                  height = Math.round((height * maxWidth) / width);
                  width = maxWidth;
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                setNewImage(canvas.toDataURL('image/jpeg', 0.75));
              };
              img.onerror = () => setNewImage(uploadEvent.target.result);
              img.src = uploadEvent.target.result;
            };
            reader.readAsDataURL(file);
          }
        };

        const exportLeadsCsv = () => {
          const csvHeaders = ['Type', 'Item / Customer Name', 'Details / Calculations / Phone', 'Price / Stock', 'Date'];
          const csvRows = [
            ['Customer Inquiry Lead', 'Rahul Roy', 'Calculated 330 sq.ft (21 boxes) for 15x20 ft room | Phone: +91 98765 43210', '₹70/sq.ft', new Date().toLocaleDateString()],
            ['Customer Inquiry Lead', 'Amitabh Sen', 'Inquired wholesale price for 4 Smart Commodes | Phone: +91 94350 12345', '₹6,950/piece', new Date().toLocaleDateString()],
            ...products.map(p => [
              'Inventory Stock Item',
              `"${p.name}"`,
              `"${p.dimensions} - ${p.finish} (${p.categoryLabel || p.category})"`,
              `"₹${p.price}/${p.unit || 'sq.ft'} (Stock: ${p.stock})"`,
              new Date().toLocaleDateString()
            ])
          ];

          const csvContent = [csvHeaders.join(','), ...csvRows.map(r => r.join(','))].join('\n');
          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.setAttribute('download', `mr_tiles_leads_and_stock_${Date.now()}.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        };

        const handleLoginSubmit = (e) => {
          e.preventDefault();
          if (username.trim() === 'Admin11' && password.trim() === 'Admin1234') {
            onLogin('mr_admin_token_' + Date.now());
          } else {
            setLoginError('Invalid credentials');
          }
        };

        const handleAddSubmit = (e) => {
          e.preventDefault();
          if (!newName || !newPrice || !newStock) {
            alert('Please fill in name, price, and stock count!');
            return;
          }

          const matchedCat = categories.find(c => c.id === newCategory);

          onAddProduct({
            name: newName,
            category: newCategory,
            categoryLabel: matchedCat ? matchedCat.label : newCategory,
            price: Number(newPrice),
            unit: newUnit || 'sq.ft',
            stock: Number(newStock),
            dimensions: newDimensions || 'Standard',
            finish: newFinish || 'High Gloss',
            image: newImage || 'images/regal-white-marble.png',
            description: newDescription || 'Premium quality product from M R Tiles & Sanitation.'
          });

          setShowAddModal(false);
          setNewName('');
          setNewPrice('');
          setNewStock('');
          setNewDescription('');
        };

        const handleAddCatSubmit = (e) => {
          e.preventDefault();
          if (!newCatLabel.trim()) return;
          const catId = newCatLabel.toLowerCase().replace(/[^a-z0-9]/g, '-');
          onAddCategory({ id: catId, label: newCatLabel });
          setShowAddCatModal(false);
          setNewCatLabel('');
        };

        if (!adminToken) {
          return (
            <div style={{ padding: '1rem', display: 'flex', justifyContent: 'center', alignItems: 'center', minHeight: '60vh' }}>
              <div style={{ width: '100%', maxWidth: '380px', background: '#ffffff', borderRadius: '12px', padding: '1.5rem', border: '1px solid #e2e8f0', boxShadow: '0 4px 12px rgba(0,0,0,0.06)' }}>
                <h2 style={{ fontSize: '1.35rem', color: '#0f172a', marginBottom: '1rem', textAlign: 'center' }}>Admin Portal Login</h2>
                {loginError && <div style={{ background: '#fee2e2', color: '#c5221f', padding: '0.6rem', borderRadius: '6px', fontSize: '0.85rem', marginBottom: '1rem', textAlign: 'center', fontWeight: '600' }}>{loginError}</div>}
                <form onSubmit={handleLoginSubmit}>
                  <div style={{ marginBottom: '1rem' }}>
                    <label style={{ display: 'block', fontSize: '0.8rem', color: '#64748b', marginBottom: '0.2rem' }}>Username</label>
                    <input type="text" required placeholder="Enter username" value={username} onChange={e => setUsername(e.target.value)} style={{ width: '100%', padding: '0.65rem', border: '1px solid #cbd5e1', borderRadius: '6px', fontSize: '1rem' }} />
                  </div>
                  <div style={{ marginBottom: '1.25rem' }}>
                    <label style={{ display: 'block', fontSize: '0.8rem', color: '#64748b', marginBottom: '0.2rem' }}>Password</label>
                    <input type="password" required placeholder="Enter password" value={password} onChange={e => setPassword(e.target.value)} style={{ width: '100%', padding: '0.65rem', border: '1px solid #cbd5e1', borderRadius: '6px', fontSize: '1rem' }} />
                  </div>
                  <button type="submit" className="btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '0.75rem' }}>Sign In to Dashboard</button>
                </form>
              </div>
            </div>
          );
        }

        return (
          <div className="admin-container" style={{ padding: '1rem' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '1rem', marginBottom: '1.25rem' }}>
              <div>
                <h1 style={{ fontSize: '1.5rem', color: '#0f172a' }}>Stock & Price Control Center</h1>
                <p style={{ fontSize: '0.82rem', color: '#64748b' }}>Manage inventory, upload device photos, add categories, and export leads</p>
              </div>

              <div style={{ display: 'flex', gap: '0.5rem', flexWrap: 'wrap' }}>
                <button className="btn-secondary" onClick={exportLeadsCsv} style={{ padding: '0.5rem 0.8rem', fontSize: '0.8rem' }}>📄 Export CSV / Excel</button>
                <button className="btn-secondary" onClick={() => setShowAddCatModal(true)} style={{ padding: '0.5rem 0.8rem', fontSize: '0.8rem' }}>➕ Add Category</button>
                <button className="btn-primary" onClick={() => setShowAddModal(true)} style={{ padding: '0.5rem 0.8rem', fontSize: '0.8rem' }}>➕ Add Tile / Stock</button>
              </div>
            </div>

            <div className="admin-table-wrap" style={{ overflowX: 'auto' }}>
              <table className="admin-table" style={{ width: '100%', minWidth: '550px' }}>
                <thead>
                  <tr>
                    <th>Item / Image</th>
                    <th>Category</th>
                    <th>Price (₹)</th>
                    <th>Stock</th>
                    <th style={{ textAlign: 'right' }}>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {products.map(p => {
                    const displayUnit = p.unit || 'sq.ft';
                    const displayImg = p.image || 'images/regal-white-marble.png';
                    const isEditing = editingId === p.id;

                    return (
                      <tr key={p.id}>
                        <td>
                          <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem' }}>
                            <img src={displayImg} alt={p.name} className="table-img" onError={e => e.target.src = 'images/regal-white-marble.png'} />
                            <div>
                              {isEditing ? (
                                <input type="text" value={editName} onChange={e => setEditName(e.target.value)} style={{ padding: '0.25rem', width: '120px' }} />
                              ) : (
                                <strong>{p.name}</strong>
                              )}
                              <div style={{ fontSize: '0.72rem', color: '#64748b' }}>{p.dimensions}</div>
                            </div>
                          </div>
                        </td>

                        <td style={{ fontSize: '0.8rem' }}>{p.categoryLabel || p.category}</td>

                        <td>
                          {isEditing ? (
                            <input type="number" value={editPrice} onChange={e => setEditPrice(e.target.value)} style={{ width: '65px', padding: '0.2rem' }} />
                          ) : (
                            `₹${p.price}/${displayUnit}`
                          )}
                        </td>

                        <td>
                          {isEditing ? (
                            <input type="number" value={editStock} onChange={e => setEditStock(e.target.value)} style={{ width: '65px', padding: '0.2rem' }} />
                          ) : (
                            `${p.stock} ${displayUnit}`
                          )}
                        </td>

                        <td style={{ textAlign: 'right' }}>
                          {isEditing ? (
                            <button className="btn-primary" style={{ padding: '0.3rem 0.6rem', fontSize: '0.75rem' }} onClick={() => { onUpdateProduct(p.id, { name: editName, price: Number(editPrice), stock: Number(editStock), unit: displayUnit }); setEditingId(null); }}>Save</button>
                          ) : (
                            <div style={{ display: 'flex', gap: '0.3rem', justifyContent: 'flex-end' }}>
                              <button className="btn-secondary" style={{ padding: '0.3rem 0.5rem', fontSize: '0.75rem' }} onClick={() => { setEditingId(p.id); setEditName(p.name); setEditPrice(p.price); setEditStock(p.stock); }}>Edit</button>
                              <button className="btn-secondary" style={{ padding: '0.3rem 0.5rem', fontSize: '0.75rem', color: '#c5221f', borderColor: '#f7c1c0' }} onClick={() => onDeleteProduct(p.id)}>Delete</button>
                            </div>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            {/* Add Product Modal */}
            {showAddModal && (
              <div className="modal-overlay" onClick={() => setShowAddModal(false)}>
                <div className="modal-content" onClick={e => e.stopPropagation()} style={{ maxWidth: '480px', width: '92%' }}>
                  <button className="modal-close" onClick={() => setShowAddModal(false)}>✕</button>
                  <h3 style={{ fontSize: '1.2rem', color: '#0f172a', marginBottom: '0.85rem' }}>Introduce New Product / Stock</h3>

                  <form onSubmit={handleAddSubmit}>
                    <div style={{ marginBottom: '0.75rem' }}>
                      <label style={{ display: 'block', fontSize: '0.78rem', color: '#64748b', marginBottom: '0.2rem' }}>Product Name *</label>
                      <input type="text" required placeholder="e.g. Italian Onyx Vitrified" value={newName} onChange={e => setNewName(e.target.value)} style={{ width: '100%', padding: '0.55rem', border: '1px solid #cbd5e1', borderRadius: '6px' }} />
                    </div>

                    <div style={{ marginBottom: '0.75rem' }}>
                      <label style={{ display: 'block', fontSize: '0.78rem', color: '#64748b', marginBottom: '0.2rem' }}>Category Section *</label>
                      <select value={newCategory} onChange={e => setNewCategory(e.target.value)} style={{ width: '100%', padding: '0.55rem', border: '1px solid #cbd5e1', borderRadius: '6px' }}>
                        {categories.filter(c => c.id !== 'all').map(c => (
                          <option key={c.id} value={c.id}>{c.label}</option>
                        ))}
                      </select>
                    </div>

                    {/* Direct Device Photo File Picker */}
                    <div style={{ marginBottom: '0.85rem' }}>
                      <label style={{ display: 'block', fontSize: '0.78rem', color: '#64748b', marginBottom: '0.25rem' }}>Upload Product Photo from Device *</label>
                      <div style={{ border: '2px dashed #cbd5e1', borderRadius: '8px', padding: '0.75rem', textAlign: 'center', background: '#f8fafc' }}>
                        <input type="file" accept="image/*" onChange={handleImageFileUpload} id="device-photo-input-root" style={{ display: 'none' }} />
                        <label htmlFor="device-photo-input-root" style={{ cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: '0.4rem', color: '#0f172a', fontWeight: 'bold', fontSize: '0.85rem' }}>
                          📸 Select Photo from Device
                        </label>
                        {newImage && (
                          <div style={{ marginTop: '0.4rem', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '0.4rem' }}>
                            <img src={newImage} alt="Preview" style={{ width: '40px', height: '40px', objectFit: 'cover', borderRadius: '4px', border: '1px solid #cbd5e1' }} />
                            <span style={{ fontSize: '0.75rem', color: '#16a34a', fontWeight: 'bold' }}>✓ Photo Loaded</span>
                          </div>
                        )}
                      </div>
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '0.5rem', marginBottom: '0.75rem' }}>
                      <div>
                        <label style={{ display: 'block', fontSize: '0.78rem', color: '#64748b', marginBottom: '0.2rem' }}>Price (₹)</label>
                        <input type="number" required placeholder="65" value={newPrice} onChange={e => setNewPrice(e.target.value)} style={{ width: '100%', padding: '0.5rem', border: '1px solid #cbd5e1', borderRadius: '6px' }} />
                      </div>
                      <div>
                        <label style={{ display: 'block', fontSize: '0.78rem', color: '#64748b', marginBottom: '0.2rem' }}>Unit</label>
                        <select value={newUnit} onChange={e => setNewUnit(e.target.value)} style={{ width: '100%', padding: '0.5rem', border: '1px solid #cbd5e1', borderRadius: '6px' }}>
                          <option value="sq.ft">sq.ft</option>
                          <option value="piece">piece</option>
                          <option value="box">box</option>
                        </select>
                      </div>
                      <div>
                        <label style={{ display: 'block', fontSize: '0.78rem', color: '#64748b', marginBottom: '0.2rem' }}>Stock</label>
                        <input type="number" required placeholder="1000" value={newStock} onChange={e => setNewStock(e.target.value)} style={{ width: '100%', padding: '0.5rem', border: '1px solid #cbd5e1', borderRadius: '6px' }} />
                      </div>
                    </div>

                    <button type="submit" className="btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '0.65rem' }}>
                      ➕ Add Product to Inventory
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* Add Category Modal */}
            {showAddCatModal && (
              <div className="modal-overlay" onClick={() => setShowAddCatModal(false)}>
                <div className="modal-content" onClick={e => e.stopPropagation()} style={{ maxWidth: '380px', width: '92%' }}>
                  <button className="modal-close" onClick={() => setShowAddCatModal(false)}>✕</button>
                  <h3 style={{ fontSize: '1.15rem', color: '#0f172a', marginBottom: '0.85rem' }}>Add New Category Section</h3>

                  <form onSubmit={handleAddCatSubmit}>
                    <div style={{ marginBottom: '1rem' }}>
                      <label style={{ display: 'block', fontSize: '0.78rem', color: '#64748b', marginBottom: '0.2rem' }}>Category Name *</label>
                      <input type="text" required placeholder="e.g. Granite & Marble" value={newCatLabel} onChange={e => setNewCatLabel(e.target.value)} style={{ width: '100%', padding: '0.55rem', border: '1px solid #cbd5e1', borderRadius: '6px' }} />
                    </div>

                    <button type="submit" className="btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '0.65rem' }}>
                      ➕ Add Category Section
                    </button>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
