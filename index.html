    <script type="text/babel">
      const { useState, useEffect } = React;

      // Verified Live Cloud Database Object for Cross-Device Global Sync
      const LIVE_CLOUD_OBJECT_ID = 'ff8081819ff5b11001a0152985c04392';
      const LIVE_CLOUD_API_URL = `https://api.restful-api.dev/objects/${LIVE_CLOUD_OBJECT_ID}`;

      // Smart Image Loader Helper with Safe Fallback
      function ProductImage({ src, alt, className }) {
        const defaultFallback = 'images/regal-white-marble.png';
        const initialSrc = src || defaultFallback;
        const [imgSrc, setImgSrc] = useState(initialSrc);
        const [fallbackIndex, setFallbackIndex] = useState(0);

        const fallbacks = [
          initialSrc,
          `./${initialSrc}`,
          `images/${(initialSrc || '').replace(/^images\//, '')}`,
          defaultFallback
        ];

        const handleError = () => {
          if (fallbackIndex < fallbacks.length - 1) {
            const nextIdx = fallbackIndex + 1;
            setFallbackIndex(nextIdx);
            setImgSrc(fallbacks[nextIdx]);
          } else {
            setImgSrc(defaultFallback);
          }
        };

        return <img src={imgSrc || defaultFallback} alt={alt} className={className} loading="lazy" onError={handleError} />;
      }

      // Initial Catalog Dataset
      const INITIAL_PRODUCTS = [

          ]
        }

      // Header Component (Clean, no icons)
      function Header({ currentView, setCurrentView, adminToken, onLogout }) {
        return (
          <header className="navbar">
            <div className="nav-content">
              <div className="brand-logo" style={{ cursor: 'pointer' }} onClick={() => setCurrentView('store')}>
                <div className="logo-icon">MR</div>
                <div>
                  <div className="brand-title">M R TILES & SANITATION</div>
                  <div className="brand-subtitle">Silchar, Assam • Premium Tiles & Sanitaryware</div>
                </div>
              </div>

              <div className="nav-links">
                {adminToken ? (
                  <div style={{ display: 'flex', gap: '0.5rem', alignItems: 'center' }}>
                    <button className={`nav-btn ${currentView === 'admin' ? 'active' : ''}`} onClick={() => setCurrentView('admin')}>

                    </button>
                    <button className="btn-secondary" style={{ padding: '0.45rem 0.75rem', fontSize: '0.8rem' }} onClick={onLogout}>
                      Logout
                    </button>
                  </div>
                ) : (
                  <button className="admin-nav-btn" onClick={() => setCurrentView('admin')}>
                    Admin Portal
                  </button>
                )}
              </div>
            </div>
          </header>
        );
      }

      // Root App Component with Guaranteed State Persistence
      function App() {
        const [currentView, setCurrentView] = useState('store');
        
        const [products, setProducts] = useState(() => {
          try {
            const local = localStorage.getItem('mr_tiles_local_v3');
            if (local) {
              const parsed = JSON.parse(local);
              if (Array.isArray(parsed) && parsed.length > 0) return parsed;
            }
          } catch(e) {}
          return INITIAL_PRODUCTS;
        });

        const [categories, setCategories] = useState([
          { id: 'all', label: 'All Products' },
          { id: 'floor-tiles', label: 'Floor Tiles' },
          { id: 'wall-tiles', label: 'Wall Tiles' },
          { id: 'sanitary', label: 'Sanitary' },
          { id: 'doors', label: 'Doors' }
        ]);
        const [activeCategory, setActiveCategory] = useState('all');
        const [adminToken, setAdminToken] = useState('');

        const [calcProduct, setCalcProduct] = useState(null);
        const [showCalcModal, setShowCalcModal] = useState(false);
        const [inquireProduct, setInquireProduct] = useState(null);
        const [inquireNote, setInquireNote] = useState('');
        const [showInquireModal, setShowInquireModal] = useState(false);

        // Fetch Cloud Database and merge safely
        const fetchCloudProducts = async () => {
          try {
            const res = await fetch(LIVE_CLOUD_API_URL);
            if (res.ok) {
              const result = await res.json();
              if (result && result.data && Array.isArray(result.data.products) && result.data.products.length > 0) {
                setProducts(prev => {
                  const cloudProds = result.data.products.map(p => ({
                    ...p,
                    unit: p.unit || 'sq.ft',
                    image: p.image || 'images/regal-white-marble.png'
                  }));

                  // Keep local added items if not in cloud
                  const cloudIds = new Set(cloudProds.map(c => c.id));
                  const localOnly = prev.filter(p => !cloudIds.has(p.id));
                  const merged = [...localOnly, ...cloudProds];
                  
                  try {
                    localStorage.setItem('mr_tiles_local_v3', JSON.stringify(merged));
                  } catch(e) {}

                  return merged;
                });
              }
            }
          } catch (err) {}
        };

        useEffect(() => {
          fetchCloudProducts();
          const timer = setInterval(fetchCloudProducts, 12000);
          return () => clearInterval(timer);
        }, []);

        // Push Updates to State, Local & Cloud DB
        const pushToCloud = async (updatedList) => {
          const sanitized = updatedList.map(p => ({
            ...p,
            unit: p.unit || 'sq.ft',
            image: p.image || 'images/regal-white-marble.png'
          }));

          setProducts(sanitized);

          try {
            localStorage.setItem('mr_tiles_local_v3', JSON.stringify(sanitized));
          } catch(e) {}

          try {
            await fetch(LIVE_CLOUD_API_URL, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: 'mr_tiles_catalog', data: { products: sanitized } })
            });
          } catch (err) {}
        };

        const filtered = products.filter(p => activeCategory === 'all' || p.category === activeCategory);

        return (
          <div className="app-container">
            <Header currentView={currentView} setCurrentView={setCurrentView} adminToken={adminToken} onLogout={() => setAdminToken('')} />

            {currentView === 'store' ? (
              <CustomerStore products={filtered} categories={categories} activeCategory={activeCategory} setActiveCategory={setActiveCategory} onOpenCalc={p => { setCalcProduct(p); setShowCalcModal(true); }} onInquire={(p, note) => { setInquireProduct(p); setInquireNote(note || ''); setShowInquireModal(true); }} onDownloadPdf={() => window.print()} />
            ) : (
              <AdminPortal products={products} categories={categories} adminToken={adminToken} onLogin={token => setAdminToken(token)} onUpdateProduct={(id, payload) => pushToCloud(products.map(p => p.id === id ? { ...p, ...payload, unit: payload.unit || p.unit || 'sq.ft' } : p))} onAddProduct={p => pushToCloud([{ id: 'prod_' + Date.now(), unit: p.unit || 'sq.ft', image: p.image || 'images/regal-white-marble.png', ...p }, ...products])} onDeleteProduct={id => window.confirm('Delete stock item?') && pushToCloud(products.filter(p => p.id !== id))} onAddCategory={c => setCategories(prev => [...prev, c])} />
            )}

            <footer className="footer">
              <div className="footer-bottom">© {new Date().getFullYear()} BLUE LEAF TECH. All rights reserved.</div>
            </footer>
          </div>
        );
      }

      // Customer Store Component
      function CustomerStore({ products, categories, activeCategory, setActiveCategory, onOpenCalc, onInquire, onDownloadPdf }) {

        return (

                  const displayUnit = prod.unit || 'sq.ft';

                  return (
                    <div key={prod.id} className="product-card">
                      <div className="card-image-wrap">
                        <ProductImage src={prod.image} alt={prod.name} className="card-img" />
                        <div className={`stock-badge ${prod.stock <= 0 ? 'out-of-stock' : (prod.stock <= 20 ? 'low-stock' : 'in-stock')}`}>

                        </div>
                        <div className="category-tag">{prod.categoryLabel || prod.category}</div>
                      </div>

                      <div className="card-body">
                        <h3 className="card-title">{prod.name}</h3>
                        <p className="card-specs">{prod.dimensions} • {prod.finish}</p>
                        
                        {prod.colors && prod.colors.length > 0 && (
                          <div className="color-selector">
                            {prod.colors.map(c => (
                              <div key={c.name} className={`color-chip ${activeColorName === c.name ? 'active' : ''}`} style={{ backgroundColor: c.hex }} onClick={() => setSelectedColors(prev => ({ ...prev, [prod.id]: c.name }))} title={c.name} />
                            ))}
                            <span className="color-label">{activeColorName}</span>
                          </div>
                        )}

                        <p style={{ fontSize: '0.8rem', color: '#64748b', marginBottom: '0.75rem', flex: 1 }}>{prod.description}</p>

                        <div className="card-price-row">
                          <div><span className="price-main">₹{prod.price.toLocaleString('en-IN')}</span> <span className="price-unit">/ {displayUnit}</span></div>
                        </div>

                        <div className="card-actions">
                          <button className="btn-sm-calc" onClick={() => onOpenCalc(prod)}>Calculate</button>
                          <button className="btn-sm-inquire" onClick={() => onInquire(prod, activeColorName ? `Selected Color: ${activeColorName}` : '')}>Request Quote</button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </section>

            {/* Showroom Google Map Location Section */}
            <section style={{ maxWidth: '1200px', margin: '3rem auto', padding: '0 1.5rem' }}>
              <div style={{ background: '#ffffff', borderRadius: '8px', padding: '2rem', border: '1px solid #e2e8f0', display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '2rem' }}>
                <div>
                  <h2 style={{ fontSize: '1.5rem', color: '#0f172a', marginBottom: '0.5rem' }}>M R Tiles & Sanitation</h2>
                  <p style={{ color: '#64748b', fontSize: '0.9rem', marginBottom: '1rem' }}>Trinayani Ln, near Karan TVS Showroom, Kanakpur, Silchar, Assam - 788006</p>
                  <p style={{ fontSize: '0.88rem', color: '#0f172a', fontWeight: 'bold' }}>Call / WhatsApp: +91 60013 99842</p>
                </div>
                <div style={{ borderRadius: '8px', overflow: 'hidden', minHeight: '300px' }}>
                  <iframe title="Showroom Location Map" src="https://maps.google.com/maps?q=M+R+TILES+AND+SANITATION,+Trinayani+Ln,+near+Karan+TVS+Showroom,+Kanakpur,+Silchar,+Assam+788006&t=&z=16&ie=UTF8&iwloc=&output=embed" width="100%" height="100%" style={{ border: 0, minHeight: '300px' }} loading="lazy" />
                </div>
              </div>
            </section>
          </main>
        );
      }

      // Mobile Responsive Admin Portal (Credentials: Admin11 / Admin1234)
      function AdminPortal({ products, categories, adminToken, onLogin, onUpdateProduct, onAddProduct, onDeleteProduct, onAddCategory }) {
        const [username, setUsername] = useState('');
        const [password, setPassword] = useState('');
        const [error, setError] = useState('');
        const [editingId, setEditingId] = useState(null);
        const [editName, setEditName] = useState('');
        const [editPrice, setEditPrice] = useState('');
        const [editStock, setEditStock] = useState('');

        const handleLogin = (e) => {
          e.preventDefault();
          if (username.trim() === 'Admin11' && password.trim() === 'Admin1234') {
            onLogin('mr_admin_token_' + Date.now());
          } else {
            setError('Invalid credentials');
          }
        };

        if (!adminToken) {
          return (
            <div style={{ padding: '1rem', display: 'flex', justifyContent: 'center', alignItems: 'center', minHeight: '60vh' }}>
              <div style={{ width: '100%', maxWidth: '380px', background: '#ffffff', borderRadius: '12px', padding: '1.5rem', border: '1px solid #e2e8f0', boxShadow: '0 4px 12px rgba(0,0,0,0.06)' }}>
                <h2 style={{ fontSize: '1.35rem', color: '#0f172a', marginBottom: '1rem', textAlign: 'center' }}>Admin Portal Login</h2>
                {error && <div style={{ background: '#fee2e2', color: '#c5221f', padding: '0.6rem', borderRadius: '6px', fontSize: '0.85rem', marginBottom: '1rem', textAlign: 'center', fontWeight: '600' }}>{error}</div>}
                <form onSubmit={handleLogin}>
                  <div style={{ marginBottom: '1rem' }}>
                    <label style={{ display: 'block', fontSize: '0.8rem', color: '#64748b', marginBottom: '0.2rem' }}>Username</label>
                    <input type="text" required placeholder="Enter username" value={username} onChange={e => setUsername(e.target.value)} style={{ width: '100%', padding: '0.65rem', border: '1px solid #cbd5e1', borderRadius: '6px', fontSize: '1rem' }} />
                  </div>
                  <div style={{ marginBottom: '1.25rem' }}>
                    <label style={{ display: 'block', fontSize: '0.8rem', color: '#64748b', marginBottom: '0.2rem' }}>Password</label>
                    <input type="password" required placeholder="Enter password" value={password} onChange={e => setPassword(e.target.value)} style={{ width: '100%', padding: '0.65rem', border: '1px solid #cbd5e1', borderRadius: '6px', fontSize: '1rem' }} />
                  </div>
                  <button type="submit" className="btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '0.75rem' }}>Sign In to Dashboard</button>
                </form>
              </div>
            </div>
          );
        }

        return (
          <div className="admin-container" style={{ padding: '1rem' }}>
            <h1 style={{ fontSize: '1.5rem', marginBottom: '1rem' }}>Stock & Price Control Center</h1>
            <div className="admin-table-wrap" style={{ overflowX: 'auto' }}>
              <table className="admin-table" style={{ width: '100%', minWidth: '550px' }}>
                <thead>
                  <tr>
                    <th>Item</th>
                    <th>Category</th>
                    <th>Price (₹)</th>
                    <th>Stock</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {products.map(p => {
                    const displayUnit = p.unit || 'sq.ft';
                    return (
                      <tr key={p.id}>
                        <td>
                          {editingId === p.id ? (
                            <input type="text" value={editName} onChange={e => setEditName(e.target.value)} style={{ padding: '0.25rem', width: '120px' }} />
                          ) : (
                            <strong>{p.name}</strong>
                          )}
                        </td>
                        <td>{p.categoryLabel || p.category}</td>
                        <td>
                          {editingId === p.id ? (
                            <input type="number" value={editPrice} onChange={e => setEditPrice(e.target.value)} style={{ width: '65px', padding: '0.2rem' }} />
                          ) : (
                            `₹${p.price}/${displayUnit}`
                          )}
                        </td>
                        <td>
                          {editingId === p.id ? (
                            <input type="number" value={editStock} onChange={e => setEditStock(e.target.value)} style={{ width: '65px', padding: '0.2rem' }} />
                          ) : (
                            `${p.stock} ${displayUnit}`
                          )}
                        </td>
                        <td>
                          {editingId === p.id ? (
                            <button onClick={() => { onUpdateProduct(p.id, { name: editName, price: Number(editPrice), stock: Number(editStock), unit: displayUnit }); setEditingId(null); }}>Save</button>
                          ) : (
                            <button onClick={() => { setEditingId(p.id); setEditName(p.name); setEditPrice(p.price); setEditStock(p.stock); }}>Edit</button>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
